# file: .github/workflows/publish.yml
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Pipeline overview
#   version        → single MinVer computation shared by every job
#   android        → pack Plugin.Maui.Intercom.Android.Binding (Windows, Gradle)
#   ios-binding    → pack Plugin.Maui.Intercom.iOS.Binding on macOS via swift-dotnet-bindings
#   main-package   → pack Plugin.Maui.Intercom against the locally produced binding packages
#   consumer-test  → clean-room MAUI app consuming ONLY the packed NuGets (simulator + device),
#                    once per shipped iOS band
#   deploy         → push the exact validated artifacts to NuGet.org on release
#
# Pinned toolchain: .NET 10 (global.json), Xcode 26.6, SwiftBindings.Sdk (global.json
# msbuild-sdks), Intercom iOS 18.7.2 (vendored xcframework), Intercom Android 17.4.1 (vendored AARs).
#
# Every package multi-targets net9.0 and net10.0 (see the TFM matrix in Directory.Build.props).
# Both bands build from the .NET 10 SDK pinned in global.json — the android/ios workloads carry
# the net9 reference packs — so no job needs a second SDK band installed.

name: publish
on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'eng/**'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/publish.yml'

  pull_request:
    branches:
      - '*'
    paths:
      - 'src/**'
      - 'eng/**'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/publish.yml'

  release:
    types: [ published ]

concurrency:
  group: publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  XCODE_PATH: /Applications/Xcode_26.6.app

permissions: {}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Fails when the pinned Intercom SDKs expose a public symbol that is not
  # classified in eng/api-coverage.json. Cheap (no .NET, no Xcode, ~10s), so it
  # runs first and catches SDK drift before the expensive macOS jobs start.
  api-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # chmod like every other eng/ script here: these are authored on Windows, where
      # core.filemode is false, so a `git add` can silently drop the exec bit.
      - name: Check native API coverage
        run: |
          chmod +x eng/api-coverage.sh
          eng/api-coverage.sh --strict

  # ──────────────────────────────────────────────────────────────────────────
  # Plain net10.0 — no MAUI workloads, no platform SDKs. Covers the shared models,
  # the generic-.NET fallback, and whether eng/api-coverage.json's "covered" entries
  # name members that actually exist (the half api-coverage.sh cannot check).
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Run tests
        run: dotnet test src/tests/Plugin.Maui.Intercom.Tests/Plugin.Maui.Intercom.Tests.csproj -c Release

  # ──────────────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.minver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Determine version (MinVer)
        id: minver
        shell: pwsh
        run: |
          dotnet tool install --global minver-cli
          git fetch --tags
          $version = minver --tag-prefix v --auto-increment minor
          if (-not $version) { throw "MinVer produced no version" }
          Write-Host "Version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────────────────
  android:
    runs-on: windows-latest
    needs: [ version, api-coverage, tests ]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('global.json', 'src/android/**/*.csproj') }}

      - name: Pack Android binding
        shell: pwsh
        run: dotnet pack src/android/Intercom.Android.Binding/Intercom.Android.Binding.csproj -c Release --output ${{ github.workspace }}/nuget -p:Version=${{ needs.version.outputs.version }}

      # Optional add-on: Ably realtime support. Not referenced by Plugin.Maui.Intercom;
      # consumers opt in. Packed here so it ships on the same version as everything else.
      - name: Pack Android Ably add-on
        shell: pwsh
        run: dotnet pack src/android/Intercom.Android.Ably/Intercom.Android.Ably.csproj -c Release --output ${{ github.workspace }}/nuget -p:Version=${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-android
          if-no-files-found: error
          retention-days: 7
          path: |
            nuget/*.nupkg
            nuget/*.snupkg

  # ──────────────────────────────────────────────────────────────────────────
  ios-binding:
    runs-on: macos-26
    needs: [ version, api-coverage, tests ]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Install iOS workload
        run: dotnet workload install ios maui-ios

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ runner.os }}-xcode26.6-${{ hashFiles('global.json', 'Directory.Build.props', 'src/macios/**/*.csproj') }}

      - name: Generate, build and pack iOS binding
        run: |
          chmod +x eng/generate-ios-binding.sh
          eng/generate-ios-binding.sh --version ${{ needs.version.outputs.version }} --output "$GITHUB_WORKSPACE/nuget"

      # The generator is the only source of the iOS surface — hand-written binding
      # supplements are not allowed here (see CLAUDE.md), so a member it failed to emit
      # is an upstream bug, and this reports it as one rather than as a C# compile error.
      - name: Verify the generated binding covers what the plugin calls
        run: |
          chmod +x eng/dump-ios-binding-api.sh
          eng/dump-ios-binding-api.sh --check

      - name: Show package contents
        run: unzip -l nuget/Plugin.Maui.Intercom.iOS.Binding.${{ needs.version.outputs.version }}.nupkg

      # The generated C# sources are build outputs (not committed); keep them
      # as a diagnostic artifact so API drift after an Intercom upgrade is easy to review.
      - name: Collect generated binding sources
        if: always()
        run: |
          mkdir -p gen-src
          rsync -am --include='*/' \
            --include='*.cs' --include='*.json' --include='*.log' \
            --include='*.props' --include='*.targets' --include='*.txt' \
            --exclude='*' \
            src/macios/Intercom.iOS.Binding/obj/ gen-src/ 2>/dev/null || true
          find gen-src -type f | head -100 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-generated-sources
          path: gen-src
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-ios
          if-no-files-found: error
          retention-days: 7
          path: |
            nuget/*.nupkg
            nuget/*.snupkg

  # ──────────────────────────────────────────────────────────────────────────
  main-package:
    runs-on: macos-26
    needs: [ version, android, ios-binding ]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-android

      - uses: actions/download-artifact@v5
        with:
          pattern: nuget-*
          merge-multiple: true
          path: nuget

      - name: Create local-feed NuGet.config
        run: |
          cat > nuget.local.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/nuget" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Build and pack main package
        run: |
          dotnet restore src/Plugin.Maui.Intercom/Plugin.Maui.Intercom.csproj --configfile nuget.local.config -p:Version=${{ needs.version.outputs.version }}
          dotnet build src/Plugin.Maui.Intercom/Plugin.Maui.Intercom.csproj -c Release --no-restore -p:Version=${{ needs.version.outputs.version }}
          dotnet pack src/Plugin.Maui.Intercom/Plugin.Maui.Intercom.csproj -c Release --no-build --output nuget -p:Version=${{ needs.version.outputs.version }}

      - name: Inspect generated nuspec
        run: |
          unzip -p nuget/Plugin.Maui.Intercom.${{ needs.version.outputs.version }}.nupkg Plugin.Maui.Intercom.nuspec

      - name: Validate package contents
        run: |
          chmod +x eng/validate-packages.sh
          eng/validate-packages.sh --version ${{ needs.version.outputs.version }} --feed nuget

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-main
          if-no-files-found: error
          retention-days: 7
          path: |
            nuget/Plugin.Maui.Intercom.${{ needs.version.outputs.version }}.nupkg
            nuget/Plugin.Maui.Intercom.${{ needs.version.outputs.version }}.snupkg

  # ──────────────────────────────────────────────────────────────────────────
  # Runs once per shipped iOS band. The two restore different assets out of the same
  # nupkg (lib/net9.0-ios18.0 vs lib/net10.0-ios26.0, and a sidecar each), so a green
  # net10 run proves nothing about net9 — which is the band that exists for consumers
  # this repo cannot otherwise reach.
  consumer-test:
    runs-on: macos-26
    needs: [ version, main-package ]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tfm: [ net9.0-ios, net10.0-ios ]
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: 'global.json'

      - name: Install iOS workload
        run: dotnet workload install maui-ios

      - uses: actions/download-artifact@v5
        with:
          pattern: nuget-*
          merge-multiple: true
          path: nuget

      - name: Clean-room consumer test (${{ matrix.tfm }}, simulator + ios-arm64)
        run: |
          chmod +x eng/test-consumer.sh
          eng/test-consumer.sh --version ${{ needs.version.outputs.version }} --feed nuget --tfm ${{ matrix.tfm }} --clear-cache

      - name: Diagnostics on failure
        if: failure()
        run: |
          dotnet --info || true
          dotnet workload list || true
          xcodebuild -version || true
          swift --version || true
          echo "── resolved assets ──"
          cat /tmp/icom-test/App/obj/project.assets.json 2>/dev/null | head -200 || true
          echo "── package entries ──"
          for p in nuget/*.nupkg; do echo "== $p"; unzip -l "$p" | head -100; done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: consumer-test-binlog-${{ matrix.tfm }}
          path: /tmp/icom-test/*.binlog
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ version, main-package, consumer-test ]
    permissions:
      id-token: write
    env:
      NuGetSource: https://api.nuget.org/v3/index.json
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: nuget-*
          merge-multiple: true
          path: nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: NuGet login (OIDC → temp API key)
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        shell: pwsh
        run: |
          foreach($file in (Get-ChildItem "nuget" -Recurse -Include *.nupkg)) {
            dotnet nuget push $file --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source ${{ env.NuGetSource }} --skip-duplicate
          }
