# file: .github/workflows/intercom-sdk-watch.yml
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Intercom SDK watch

on:
  # GitHub cron schedules use UTC.
  schedule:
    - cron: '23 12 * * *'

  # Allows the check to be run immediately from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: intercom-sdk-watch
  cancel-in-progress: false

jobs:
  check:
    name: Check native Intercom SDK versions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check for newer Intercom releases
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            function readProperty(xml, propertyName) {
              const expression = new RegExp(
                `<${propertyName}>\\s*([^<]+?)\\s*</${propertyName}>`
              );

              const match = xml.match(expression);

              if (!match) {
                throw new Error(
                  `Could not find ${propertyName} in Directory.Build.props.`
                );
              }

              return match[1].trim().replace(/^v/, "");
            }

            function versionParts(version) {
              const match = /^v?(\d+)\.(\d+)\.(\d+)/.exec(version);

              if (!match) {
                throw new Error(`Unsupported version format: ${version}`);
              }

              return match.slice(1).map(Number);
            }

            function isNewer(candidate, current) {
              const candidateParts = versionParts(candidate);
              const currentParts = versionParts(current);

              for (let index = 0; index < 3; index++) {
                if (candidateParts[index] > currentParts[index]) {
                  return true;
                }

                if (candidateParts[index] < currentParts[index]) {
                  return false;
                }
              }

              return false;
            }

            const propsResponse = await github.rest.repos.getContent({
              owner,
              repo,
              path: "Directory.Build.props"
            });

            if (
              Array.isArray(propsResponse.data) ||
              typeof propsResponse.data.content !== "string"
            ) {
              throw new Error(
                "Directory.Build.props did not contain readable file content."
              );
            }

            const props = Buffer
              .from(propsResponse.data.content, "base64")
              .toString("utf8");

            const currentIosVersion = readProperty(
              props,
              "IntercomIosSdkVersion"
            );

            const currentAndroidVersion = readProperty(
              props,
              "IntercomAndroidSdkVersion"
            );

            // Load existing issues once. Closed issues count too, preventing an
            // issue for the same platform/version from being recreated.
            const existingIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "all",
                per_page: 100
              }
            );

            async function createUpgradeIssue({
              platform,
              currentVersion,
              latestVersion,
              sourceUrl,
              checklist
            }) {
              if (!isNewer(latestVersion, currentVersion)) {
                core.info(
                  `${platform}: ${currentVersion} is current; latest is ${latestVersion}.`
                );
                return;
              }

              const title =
                `[dependency] Intercom ${platform} SDK ${latestVersion} available`;

              const alreadyExists = existingIssues.some(
                issue =>
                  !issue.pull_request &&
                  issue.title === title
              );

              if (alreadyExists) {
                core.info(`Issue already exists: ${title}`);
                return;
              }

              const marker =
                `<!-- intercom-sdk-watch:${platform.toLowerCase()}:${latestVersion} -->`;

              const body = [
                marker,
                `A newer Intercom ${platform} SDK is available.`,
                "",
                "| | Version |",
                "|---|---:|",
                `| Currently pinned | \`${currentVersion}\` |`,
                `| Latest available | \`${latestVersion}\` |`,
                "",
                `Release source: ${sourceUrl}`,
                "",
                "## Upgrade checklist",
                "",
                ...checklist,
                "",
                "_This issue was created automatically by the Intercom SDK watch workflow._"
              ].join("\n");

              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });

              core.notice(
                `Created ${platform} upgrade issue: ${created.data.html_url}`
              );

              existingIssues.push(created.data);
            }

            // iOS: Intercom publishes official releases through GitHub.
            const iosRelease = await github.rest.repos.getLatestRelease({
              owner: "intercom",
              repo: "intercom-ios"
            });

            const latestIosVersion =
              iosRelease.data.tag_name.replace(/^v/, "");

            await createUpgradeIssue({
              platform: "iOS",
              currentVersion: currentIosVersion,
              latestVersion: latestIosVersion,
              sourceUrl: iosRelease.data.html_url,
              checklist: [
                `- [ ] Update \`IntercomIosSdkVersion\` in \`Directory.Build.props\` to \`${latestIosVersion}\`.`,
                "- [ ] Replace the vendored `Intercom.xcframework`.",
                "- [ ] Regenerate or update the iOS bindings.",
                "- [ ] Review API additions and breaking changes.",
                "- [ ] Update version references in documentation and workflow comments.",
                "- [ ] Run `eng/api-coverage.sh --strict`.",
                "- [ ] Build the iOS binding and consumer test projects.",
                "- [ ] Test login, logout, Messenger presentation, push notifications, and unread counts on a device."
              ]
            });

            // Android: Maven metadata reflects versions actually available for
            // io.intercom.android:intercom-sdk-base.
            const metadataUrl =
              "https://repo1.maven.org/maven2/io/intercom/android/" +
              "intercom-sdk-base/maven-metadata.xml";

            const metadataResponse = await fetch(metadataUrl, {
              headers: {
                "User-Agent": `${owner}/${repo} Intercom SDK version watcher`
              }
            });

            if (!metadataResponse.ok) {
              throw new Error(
                `Maven metadata request failed: ` +
                `${metadataResponse.status} ${metadataResponse.statusText}`
              );
            }

            const metadata = await metadataResponse.text();

            const releaseMatch =
              metadata.match(/<release>\s*([^<]+?)\s*<\/release>/);

            if (!releaseMatch) {
              throw new Error(
                "Maven metadata did not contain a release version."
              );
            }

            const latestAndroidVersion =
              releaseMatch[1].trim().replace(/^v/, "");

            await createUpgradeIssue({
              platform: "Android",
              currentVersion: currentAndroidVersion,
              latestVersion: latestAndroidVersion,
              sourceUrl:
                "https://central.sonatype.com/artifact/" +
                "io.intercom.android/intercom-sdk-base/" +
                latestAndroidVersion,
              checklist: [
                `- [ ] Update \`IntercomAndroidSdkVersion\` in \`Directory.Build.props\` to \`${latestAndroidVersion}\`.`,
                `- [ ] Update the versions in \`src/android/native/mauiintercom/build.gradle.kts\` to \`${latestAndroidVersion}\`.`,
                "- [ ] Replace the vendored Intercom AAR files.",
                "- [ ] Review Intercom's updated Maven dependency graph.",
                "- [ ] Update or replace affected transitive dependency AARs.",
                "- [ ] Update `src/android/Intercom.Android.Binding/README.md`.",
                "- [ ] Update version references in workflow comments and documentation.",
                "- [ ] Regenerate or update Android metadata transforms and bindings.",
                "- [ ] Run `eng/api-coverage.sh --strict`.",
                "- [ ] Build the Android binding and consumer test projects.",
                "- [ ] Test login, logout, Messenger presentation, push notifications, and unread counts on a device."
              ]
            });